<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Administrativo EPS - Acceso Privado</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/icons/apple-touch-icon.png') }}" />
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/icons/favicon-32x32.png') }}" />
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/icons/favicon-16x16.png') }}" />
<link rel="manifest" href="{{ url_for('static', filename='img/icons/site.webmanifest') }}" />
<!-- CSS personalizado -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<!-- Toastify CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/dist/toastify.min.css">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
<!-- Cargar JS correctamente -->
<script src="{{ url_for('static', filename='js/iniciar_sesion.js') }}"></script>  
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center" style="height: 100vh;">
        <div class="login-container">
            <div class="login-header">
                <img src="/EPS/img/farme.avif" alt="Logo EPS" class="logo">
                <h2>Sistema Administrativo EPS</h2>
                <p class="text-muted mb-2">Portal de acceso para personal autorizado</p>
                <div class="security-badge">
                    <i class="bi bi-shield-check"></i> Acceso Seguro
                </div>
            </div>
            
            <form id="loginForm" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" placeholder="Ingrese su usuario" required autocomplete="off">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                     <button class="btn btn-outline-secondary" type="button" id="togglePassword" style="margin-top:10px;">
                      <i class="bi bi-eye"></i>
                    </button>
                </div>
                
                <button type="submit" class="btn btn-primary" onclick="limpiarCampos()">Ingresar al Sistema</button>
                
                <div class="text-center mt-3">
                    <a href="#" class="text-decoration-none" style="color: #0277bd;">¿Olvidó su contraseña?</a>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
