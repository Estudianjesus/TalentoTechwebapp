<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <div class="container mt-4">
        <ul class="nav nav-tabs" id="myTabs">
            <li class="nav-item">
                <a class="nav-link active" id="tab-inicio" data-bs-toggle="tab" href="#inicio">Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tab-citas" data-bs-toggle="tab" href="#mis-citas">Mis Citas</a>
            </li>
        </ul>

        <div class="tab-content mt-3">
            <!-- Contenido de la pestaña de inicio -->
            <div class="tab-pane fade show active" id="inicio">
                <h3>Bienvenido</h3>
                <p>Esta es la página de inicio.</p>
            </div>

            <!-- Contenido de la pestaña de citas -->
            <div class="tab-pane fade" id="mis-citas">
                <h3>Mis Citas</h3>
                <p>Aquí aparecerán tus citas.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("DOM cargado. URL actual:", window.location.href);

            // Verificar si estamos en la URL correcta
            if (window.location.href.includes("/portal_paciente/mis_citas")) {
                console.log("Cambiando automáticamente a la pestaña de Mis Citas.");

                let tabTrigger = new bootstrap.Tab(document.querySelector('a[href="#mis-citas"]'));
                tabTrigger.show();
            }

            // Evento de clic en la pestaña "Mis Citas"
            document.querySelector("#tab-citas").addEventListener("click", function () {
                console.log("Cambiando manualmente a la pestaña de Mis Citas.");
            });

            // Evento de activación de pestaña
            document.querySelectorAll('.nav-link').forEach(tab => {
                tab.addEventListener('shown.bs.tab', function (event) {
                    console.log("Pestaña activa:", event.target.getAttribute("href"));
                });
            });
        });
    </script>
</body>
</html>
