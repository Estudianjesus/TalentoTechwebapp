{% extends "usuario_dasword.html" %}

{% block content %}    

<div id="fechas-container" class="fechas-tabs"></div>
<div id="citas-container" class="citas-container"></div>

<script>
    // Contenedores principales
    const fechasContainer = document.getElementById('fechas-container');
    const citasContainer = document.getElementById('citas-container');
    
    // Variable para almacenar todas las citas
    let todasLasCitas = [];
    let fechasUnicas = [];
    
    // Obtener las citas desde la API
    fetch('/api/hitorial_cita', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json',
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Error al obtener las citas');
        }
        return response.json();
    })
    .then(data => {
        todasLasCitas = data.citas;

        if (todasLasCitas.length === 0) {
            citasContainer.innerHTML = '<div class="no-citas">No hay citas disponibles.</div>';
            return;
        }
        
        // Ordenar citas por fecha
        todasLasCitas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
        
        // Extraer fechas únicas
        fechasUnicas = [...new Set(todasLasCitas.map(cita => cita.fecha))];
        
        // Crear pestañas de fechas
        crearPestañasFechas();
        
        // Mostrar citas de la primera fecha por defecto
        if (fechasUnicas.length > 0) {
            mostrarCitasPorFecha(fechasUnicas[0]);
        }
    })
    .catch(error => {
        console.error('Error fetching citas:', error);
        citasContainer.innerHTML = '<div class="error-message">Ocurrió un error al cargar las citas. Inténtalo más tarde.</div>';
    });

    // Función para crear las pestañas de fechas
    function crearPestañasFechas() {
        fechasContainer.innerHTML = '';
        
        fechasUnicas.forEach((fecha, index) => {
            const fechaTab = document.createElement('div');
            fechaTab.classList.add('fecha-tab');
            if (index === 0) {
                fechaTab.classList.add('active');
            }
            
            // Formatear la fecha para mostrarla de manera amigable
            const fechaObj = new Date(fecha);
            const opciones = { weekday: 'short', day: 'numeric', month: 'short' };
            const fechaFormateada = fechaObj.toLocaleDateString('es-ES', opciones);
            
            fechaTab.textContent = fechaFormateada;
            fechaTab.setAttribute('data-fecha', fecha);
            fechaTab.addEventListener('click', () => {
                // Quitar la clase active de todas las pestañas
                document.querySelectorAll('.fecha-tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                // Agregar la clase active a la pestaña seleccionada
                fechaTab.classList.add('active');
                
                // Mostrar las citas de la fecha seleccionada
                mostrarCitasPorFecha(fecha);
            });
            
            fechasContainer.appendChild(fechaTab);
        });
    }
    
    // Función para mostrar las citas por fecha
    function mostrarCitasPorFecha(fecha) {
        const citasEnFecha = todasLasCitas.filter(cita => cita.fecha === fecha);
        
        // Ordenar por hora
        citasEnFecha.sort((a, b) => {
            const horaA = a.hora.split(':').map(Number);
            const horaB = b.hora.split(':').map(Number);
            
            if (horaA[0] !== horaB[0]) {
                return horaA[0] - horaB[0];
            }
            return horaA[1] - horaB[1];
        });
        
        citasContainer.innerHTML = '';
        
        // Crear el encabezado de la fecha seleccionada
        const fechaObj = new Date(fecha);
        const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const fechaCompleta = fechaObj.toLocaleDateString('es-ES', opcionesFecha);
        
        const fechaHeader = document.createElement('div');
        fechaHeader.classList.add('fecha-header');
        fechaHeader.innerHTML = `<h3>Citas para el ${fechaCompleta}</h3>`;
        citasContainer.appendChild(fechaHeader);
        
        // Crear tarjetas para cada cita
        citasEnFecha.forEach(cita => {
            const citaCard = document.createElement('div');
            citaCard.classList.add('cita-card');
            
            // Determinar la clase de estado para el color
            let estadoClass = '';
            switch(cita.estado.toLowerCase()) {
                case 'confirmada':
                    estadoClass = 'status-confirmed';
                    break;
                case 'pendiente':
                    estadoClass = 'status-pending';
                    break;
                case 'cancelada':
                    estadoClass = 'status-cancelled';
                    break;
                default:
                    estadoClass = 'status-default';
            }
            
            citaCard.innerHTML = `
                <div class="cita-tiempo">
                    <i class="far fa-clock"></i> ${cita.hora}
                </div>
                <div class="cita-detalles">
                    <p class="cita-motivo"><strong>Servicio:</strong> ${(cita.tipo_servicio || 'No especificado').toUpperCase()}</p>
                    <p class="cita-especialidad"><strong>Especialidad:</strong> ${(cita.especialidad || 'No especificado').toUpperCase()}</p>
                    <p class="cita-tipo-examen"><strong>Tipo de Examen:</strong> ${(cita.tipo_examen || 'No especificado').toUpperCase()}</p>
                    <p class="cita-motivo-detalle"><strong>Motivo:</strong> ${(cita.motivo || 'No especificado')}</p>
                    <p class="cita-codigo"><strong>Código de Confirmación:</strong> ${(cita.codigo_confirmacion || 'No disponible')}</p>
                    <p class="cita-estado ${estadoClass}"><strong>Estado:</strong> ${cita.estado}</p>
                </div>
                
            `;
            
            citasContainer.appendChild(citaCard);
        });
    }

    // Función para cancelar una cita
    function cancelarCita(citaId) {
        // Crear un modal personalizado para confirmar la cancelación
        const modal = document.createElement('div');
        modal.classList.add('custom-modal');
        modal.innerHTML = `
            <div class="modal-overlay"></div>
            <div class="modal-content">
            <h3>Confirmación</h3>
            <p>¿Estás seguro de que deseas cancelar esta cita?</p>
            <div class="modal-actions">
                <button class="modal-confirm">Sí, cancelar</button>
                <button class="modal-cancel">No, volver</button>
            </div>
            </div>
        `;
        document.body.appendChild(modal);

        // Estilos para el modal
        const style = document.createElement('style');
        style.innerHTML = `
            .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            }
            .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            }
            .modal-content {
            position: relative;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1001;
            max-width: 400px;
            width: 90%;
            }
            .modal-content h3 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            color: #333;
            }
            .modal-content p {
            margin: 0 0 20px;
            font-size: 1rem;
            color: #555;
            }
            .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            }
            .modal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            }
            .modal-confirm {
            background: #f44336;
            color: #fff;
            }
            .modal-confirm:hover {
            background: #d32f2f;
            }
            .modal-cancel {
            background: #e0e0e0;
            color: #333;
            }
            .modal-cancel:hover {
            background: #bdbdbd;
            }
        `;
        document.head.appendChild(style);

        // Manejar la acción de confirmación
        modal.querySelector('.modal-confirm').addEventListener('click', () => {
            fetch(`/api/cancelar_cita/${citaId}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            }
            })
            .then(response => {
            if (response.status === 204) {
                // Mostrar mensaje de éxito con animación
                const successMessage = document.createElement('div');
                successMessage.classList.add('success-message');
                successMessage.textContent = 'Cita cancelada exitosamente';
                document.body.appendChild(successMessage);
                
                // Eliminar mensaje después de la animación
                setTimeout(() => {
                successMessage.classList.add('fadeOut');
                setTimeout(() => {
                    document.body.removeChild(successMessage);
                    location.reload(); // Recargar la página para ver los cambios
                }, 500);
                }, 2000);
            } else {
                return response.json().then(data => {
                alert(data.message || 'Error al cancelar la cita. Inténtalo de nuevo.');
                });
            }
            })
            .catch(error => {
            console.error('Error al cancelar la cita:', error);
            alert('Ocurrió un error al intentar cancelar la cita.');
            })
            .finally(() => {
            document.body.removeChild(modal); // Cerrar el modal
            });
        });

        // Manejar la acción de cancelación
        modal.querySelector('.modal-cancel').addEventListener('click', () => {
            document.body.removeChild(modal); // Cerrar el modal
        });
    }
</script>

<style>
    /* Estilos generales */
    #fechas-container, #citas-container {
        margin-top: 30px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Estilo para las pestañas de fechas */
    .fechas-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #e0e0e0;
    }
    
    .fecha-tab {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 10px 15px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 500;
        text-align: center;
        min-width: 100px;
    }
    
    .fecha-tab:hover {
        background: #e0f7fa;
        transform: translateY(-2px);
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    
    .fecha-tab.active {
        background: #4fc3f7;
        color: white;
        border-color: #4fc3f7;
        box-shadow: 0 3px 10px rgba(79, 195, 247, 0.3);
    }
    
    /* Contenedor de citas */
    .citas-container {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        padding: 20px;
    }
    
    .fecha-header {
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #eceff1;
    }
    
    .fecha-header h3 {
        color: #455a64;
        font-weight: 600;
        margin: 0;
        text-transform: capitalize;
    }
    
    /* Estilos para las tarjetas de citas */
    .cita-card {
        display: flex;
        align-items: center;
        background: #f9f9f9;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        border-left: 5px solid #4fc3f7;
    }
    
    .cita-card:hover {
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .cita-tiempo {
        background: #e1f5fe;
        padding: 10px 15px;
        border-radius: 8px;
        font-weight: bold;
        color: #0288d1;
        margin-right: 20px;
        min-width: 100px;
        text-align: center;
    }
    
    .cita-detalles {
        flex-grow: 1;
    }
    
    .cita-motivo {
        font-size: 16px;
        font-weight: 500;
        margin: 0 0 5px 0;
        color: #37474f;
    }
    
    .cita-estado {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        
    }
    
    .status-confirmed {
        background: #e8f5e9;
        color: #2e7d32;
    }
    
    .status-pending {
        background: #fff8e1;
        color: #ff8f00;
    }
    
    .status-cancelled {
        background: #ffebee;
        color: #c62828;
    }
    
    .status-default {
        background:rgb(13, 190, 39);
        color:rgb(255, 255, 255);
    }
    
    .cita-acciones {
        display: flex;
        justify-content: flex-end;
    }
    
    .cancel-button {
        background-color: #f44336;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .cancel-button:hover {
        background-color: #e53935;
        box-shadow: 0 3px 8px rgba(244, 67, 54, 0.3);
    }
    
    /* Estilos para mensaje de éxito */
    .success-message {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #4caf50;
        color: white;
        padding: 15px 25px;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        z-index: 1000;
        animation: fadeIn 0.5s;
    }
    
    .success-message.fadeOut {
        animation: fadeOut 0.5s;
    }
    
    /* Estilos para mensajes de error y vacío */
    .error-message, .no-citas {
        text-align: center;
        padding: 30px;
        background: #f5f5f5;
        border-radius: 10px;
        color: #757575;
        font-weight: 500;
    }
    
    .error-message {
        color: #d32f2f;
    }
    
    /* Animaciones */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-20px); }
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
        .cita-card {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .cita-tiempo {
            margin-right: 0;
            margin-bottom: 10px;
            width: 100%;
        }
        
        .cita-acciones {
            margin-top: 15px;
            width: 100%;
        }
        
        .cancel-button {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<!-- Añadir íconos de Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
{% endblock %}
