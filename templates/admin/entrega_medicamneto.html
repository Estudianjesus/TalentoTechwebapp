{% extends "dashboard_farmacia.html" %}

{% block content %}
<div class="container">
    <h2>Registro de Entrega de Medicamentos por la Farmacia</h2>
    <p>En este apartado, la farmacia puede registrar la entrega de medicamentos a los pacientes.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="pharmacy_name">Nombre de la Farmacia:</label>
            <input type="text" id="pharmacy_name" name="pharmacy_name" class="form-control" value="{{ pharmacy_name }}" readonly>
        </div>
        <div class="form-group">
            <label for="patient_name">Nombre del Paciente:</label>
            <input type="text" id="patient_name" name="patient_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="medication">Medicamento:</label>
            <input type="text" id="medication" name="medication" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="delivery_date">Fecha de Entrega:</label>
            <input type="date" id="delivery_date" name="delivery_date" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Registrar Entrega</button>
    </form>
</div>
{% endblock %}
