{% extends "dashboard_farmacia.html" %}
{% block content %}

<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 20px;
        color: #333;
    }
    .container {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        padding: 20px;
        overflow-x: auto; /* Permite desplazamiento horizontal */
        margin-top: 5px;
    }
    h2 {
        color: #2c3e50;
        text-align: center;
        margin-bottom: 20px;
        border-bottom: 3px solid #3498db;
        padding-bottom: 10px;
    }
    .table-container {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #ccc;
        width: 100%;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th {
        background-color: #1a8b9d;;
        color: white;
        padding: 12px;
        text-align: left;
        font-weight: 600;
        border: 1px solid bisque;
    }
    td {
        padding: 10px;
        border-bottom: 1px solid #e0e0e0;
        text-align: left;
        border: 1px solid #3498db;
    }
    td img {
        border-radius: 4px;
        object-fit: cover;
        max-width: 50px;
        height: auto;
    }
    .stock-low {
        color: #e74c3c;
        font-weight: bold;
    }
    .stock-medium {
        color: #f39c12;
    }
    .stock-high {
        color: #2ecc71;
    }

    th ,td{
        border-bottom: 1px navy;
    }
    h2{
        color:  #1a8b9d;;
    }

    /* Responsividad */
    @media (max-width: 768px) {
        th, td {
            padding: 8px;
            font-size: 14px;
        }
        h2 {
            font-size: 18px;
        }
    }
    @media (max-width: 480px) {
        .container {
            padding: 10px;
        }
        table {
            font-size: 12px;
        }
        td img {
            max-width: 60px !important;
        }
    }

    img{
        max-width:  200px !important;
        height: 70px !important;
    }

    td img {
        transition: transform 0.3s ease-in-out !important;
    }
    
    td img:hover {
        transform: scale(1.5) !important;
    }
</style>
<div class="container">
    <h2>📋 Inventario de Medicamentos</h2>

    <!-- Buscador global -->
    <input type="text" id="buscador" placeholder="🔍 Buscar medicamentos en toda la tabla..." class="form-control mb-3">

    <a class="mb-5 mx-auto" href="{{ url_for('agregar_medicamento') }}">Agregar Nuevo Medicamento</a>

    <div class="table-container">
        <table border="0">
            <thead>
                <tr> 
                    <th>ID</th>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Concentración</th>
                    <th>Laboratorio</th>
                    <th>Estado</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="medicamentos-table">
                <!-- Contenido se insertará via AJAX -->
            </tbody>
        </table>
    </div>
</div>

<script>
    $(document).ready(function() {
        let medicamentosData = [];  // Guardamos la lista original de medicamentos

        function cargarMedicamentos(data) {
            let rows = "";
            data.forEach(m => {
                // Clasificación de stock
                let stockClass = m.stock < 10 ? 'stock-low' : 
                                 m.stock < 50 ? 'stock-medium' : 
                                 'stock-high';

                // Imagen segura
                let imgSrc = m.imagen_url && m.imagen_url.trim() !== '' 
                    ? m.imagen_url 
                    : "/static/medicamentos/default.jpg";

                // Evitar XSS
                const safeNombre = $('<div>').text(m.nombre).html();
                const safeTipo = $('<div>').text(m.tipo).html();
                const safeLaboratorio = $('<div>').text(m.laboratorio).html();
                const safeEstado = $('<div>').text(m.estado).html();
                const safeConcentracion = $('<div>').text(m.concentracion).html();
                const safeStock = $('<div>').text(m.stock).html();

                rows += `
                    <tr>
                        <td>${m.id}</td>
                        <td><img src="${imgSrc}" alt="Imagen" width="100px"></td>
                        <td>${safeNombre}</td>
                        <td>${safeTipo}</td>
                        <td>${safeConcentracion}</td>
                        <td>${safeLaboratorio}</td>
                        <td>${safeEstado}</td>
                        <td class="${stockClass}">${safeStock}</td>
                        <td>
                            <a href="/editar_medicamento/${m.id}" class="edit-link text-decoration-none">✏️ Editar</a>
                            <a href="/eliminar_medicamento/${m.id}" class="delete-link text-decoration-none text-danger" 
                               onclick="return confirm('¿Estás seguro de eliminar este medicamento?');">🗑️ Eliminar</a>
                        </td>
                    </tr>
                `;
            });

            // Insertar filas en la tabla
            $("#medicamentos-table").html(rows);
        }

        // Cargar medicamentos con AJAX
        $.ajax({
            url: "/dashboard_farmacia/medicamentos",
            method: "GET",
            dataType: "json",
            success: function(response) {
                if (response && response.status === "success" && response.medicamentos) {
                    medicamentosData = response.medicamentos;  // Guardamos los datos originales
                    cargarMedicamentos(medicamentosData);  // Mostramos la tabla
                } else {
                    console.log("No se encontraron medicamentos o hubo un error en la respuesta");
                    $("#medicamentos-table").html('<tr><td colspan="10">No hay medicamentos disponibles</td></tr>');
                }
            },
            error: function(xhr, status, error) {
                console.error("Error al obtener los medicamentos:", error);
                $("#medicamentos-table").html('<tr><td colspan="10">Error al cargar los medicamentos</td></tr>');
            }
        });

        // Filtro global en toda la tabla
        $("#buscador").on("keyup", function() {
            let valor = $(this).val().toLowerCase();

            let filtrados = medicamentosData.filter(m => {
                return Object.values(m).some(val => 
                    String(val).toLowerCase().includes(valor)
                );
            });

            cargarMedicamentos(filtrados);
        });
    });
</script>


{% endblock %}
